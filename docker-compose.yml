services:
  postgres:
    image: postgres:16-alpine
    container_name: agendaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendaia
    ports:
      - "5433:5432"
    volumes:
      - agendaia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendaia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendaia_pgdata:
